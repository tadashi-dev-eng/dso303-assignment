<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Exams</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1d2433; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    .q { border: 1px solid #d0d7e2; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    #status { font-size: .9rem; color: #4a5568; }
    button { padding: .5rem 1rem; border-radius: 6px; border: 1px solid #2b6cb0; background: #2b6cb0; color: #fff; cursor: pointer; }
    textarea { width: 100%; min-height: 4rem; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Online Exams</h1>
    <span id="timer"></span>
  </header>
  <p id="status">Signed-in users see their open exams here.</p>
  <section id="exam"></section>
  <h2>Submit an assignment</h2>
  <input type="file" id="file" accept=".pdf,.zip">
  <button id="upload">Upload</button>
  <script>
    // API is served by CloudFront under /api (same origin). Tokens come from Cognito Hosted UI.
    const API = '/api';
    const token = sessionStorage.getItem('idToken');
    const auth = token ? { Authorization: 'Bearer ' + token } : {};
    const answers = {}; let attemptId = null; let dirty = false;
    const status = (t) => document.getElementById('status').textContent = t;

    async function openExam(examId) {
      const exam = await (await fetch(`${API}/exams/${examId}`, { headers: auth })).json();
      const attempt = await (await fetch(`${API}/exams/${examId}/attempts`, { method: 'POST', headers: auth })).json();
      attemptId = attempt.attemptId;
      document.getElementById('title').textContent = exam.title;
      document.getElementById('exam').innerHTML = exam.questions.map((q) => `<div class="q"><p>${q.prompt}</p>` +
        (q.qtype === 'mcq'
          ? q.options.map((o) => `<label><input type="radio" name="${q.question_id}" value="${o}"> ${o}</label><br>`).join('')
          : `<textarea name="${q.question_id}"></textarea>`) + '</div>').join('');
      document.getElementById('exam').addEventListener('input', (e) => { answers[e.target.name] = e.target.value; dirty = true; });
      setInterval(autosave, attempt.autosaveSeconds * 1000); // every 30 s
    }

    async function autosave() {
      if (!dirty || !attemptId) return;
      dirty = false;
      const payload = { clientTs: Date.now(), answers: Object.entries(answers).map(([questionId, value]) => ({ questionId, value })) };
      localStorage.setItem('draft-' + attemptId, JSON.stringify(payload)); // survives a network blip
      const r = await fetch(`${API}/attempts/${attemptId}/answers`, { method: 'PUT', headers: { ...auth, 'content-type': 'application/json' }, body: JSON.stringify(payload) });
      if (r.ok) status('Saved ' + new Date().toLocaleTimeString()); else { dirty = true; status('Save failed, retrying in 30 s'); }
    }

    document.getElementById('upload').onclick = async () => {
      const f = document.getElementById('file').files[0];
      if (!f) return;
      const presign = await (await fetch(`${API}/uploads`, { method: 'POST', headers: { ...auth, 'content-type': 'application/json' },
        body: JSON.stringify({ courseId: 'DSO303', assignmentId: 'A2', fileName: f.name, size: f.size }) })).json();
      const put = await fetch(presign.uploadUrl, { method: 'PUT', headers: presign.headers, body: f }); // straight to S3
      status(put.ok ? 'Uploaded ' + f.name : 'Upload failed');
    };

    const params = new URLSearchParams(location.search);
    if (params.get('exam')) openExam(params.get('exam'));
  </script>
</body>
</html>
